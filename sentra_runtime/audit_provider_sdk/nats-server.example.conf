# Native nats-server template only. Not started/imported by SENTRA.
# Replace paths, SCOPE, credentials and names with owner-controlled deployment.
port: 4222
jetstream { store_dir: "C:/SENTRA/nats/jetstream"; max_memory_store: 64MB; max_file_store: 1GB }
tls {
  cert_file: "C:/SENTRA/nats/server.crt"
  key_file: "C:/SENTRA/nats/server.key"
  ca_file: "C:/SENTRA/nats/ca.crt"
  verify: true
}
authorization {
  users: [{
    user: "sentra-owner-scoped"
    password: $SENTRA_NATS_SCOPED_PASSWORD
    permissions: {
      publish: [
        "sentra.SCOPE.notifications.>",
        "$JS.API.STREAM.INFO.SENTRA_EVENTS",
        "$JS.API.STREAM.MSG.GET.SENTRA_EVENTS",
        "$JS.API.CONSUMER.INFO.SENTRA_EVENTS.SENTRA_HOST",
        "$JS.API.CONSUMER.MSG.NEXT.SENTRA_EVENTS.SENTRA_HOST",
        "$JS.ACK.SENTRA_EVENTS.SENTRA_HOST.>"
      ]
      subscribe: ["_INBOX.>"]
    }
  }]
}
# Resource creation belongs to a separate operator/admin credential role.
# Production NKey/JWT account configuration can replace this user template.
