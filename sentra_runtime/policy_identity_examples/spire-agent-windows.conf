# Owner template derived from cloned Windows workload-attestor integration.
# Agent/CA must already be provisioned by the deployment operator.
agent {
    data_dir = "C:/SENTRA/spire/data"
    log_level = "INFO"
    server_address = "spire-server.example.invalid"
    server_port = "8081"
    trust_bundle_path = "C:/SENTRA/spire/bootstrap.crt"
    trust_domain = "sentra.example"
    named_pipe_name = "\\spire-agent\\public\\api"
}
plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "C:/SENTRA/spire/agent.key.pem"
            certificate_path = "C:/SENTRA/spire/agent.crt.pem"
        }
    }
    KeyManager "disk" {
        plugin_data { directory = "C:/SENTRA/spire/keys" }
    }
    WorkloadAttestor "windows" {
        plugin_data {
            discover_workload_path = true
        }
    }
}
