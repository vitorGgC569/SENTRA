<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTRA Console</title>
<style>
  :root { color-scheme: dark; --bg: #0f141b; --panel: #161d27; --line: #2a3442;
          --txt: #e6edf3; --dim: #8b98ab; --acc: #2f81f7; --ok: #3fb950;
          --warn: #d29922; --bad: #f85149; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--txt); font-size: 14px; }
  #topbar { height: 48px; background: #010409; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 1rem; padding: 0 1rem; }
  #topbar strong { font-size: 15px; } #topbar strong span { color: var(--acc); }
  #topbar .sp { flex: 1; } #topbar small { color: var(--dim); }
  #layout { display: flex; height: calc(100vh - 48px); }
  nav { width: 200px; background: #010409; border-right: 1px solid var(--line);
        padding: .5rem; display: flex; flex-direction: column; gap: 2px; }
  nav button { background: none; border: none; color: var(--txt); text-align: left;
        padding: .55rem .7rem; border-radius: 6px; cursor: pointer; font-size: 14px;
        display: flex; justify-content: space-between; align-items: center; }
  nav button:hover { background: var(--panel); }
  nav button.on { background: var(--panel); border-left: 3px solid var(--acc); }
  nav .cnt { background: var(--bad); border-radius: 1rem; padding: 0 .5rem;
        font-size: 12px; font-weight: bold; }
  nav footer { margin-top: auto; padding: .5rem; color: var(--dim); font-size: 11px; }
  main { flex: 1; overflow-y: auto; padding: 1rem 1.2rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: .7rem; margin-bottom: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: .8rem; } .card b { font-size: 22px; display: block; }
  .card small { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
        border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
  th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line);
        vertical-align: top; }
  th { color: var(--dim); font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #1c2635; }
  .pill { display: inline-block; font-size: 12px; padding: .1rem .55rem;
        border-radius: 1rem; background: #22314d; white-space: nowrap; }
  .COMPLETED, .CANDIDATE_READY, .APPLIED, .CONFIRMED { color: var(--ok); }
  .FAILED, .NOT_SENT, .UNCERTAIN, .BLOCKED { color: var(--bad); }
  .RUNNING, .IN_FLIGHT { color: var(--warn); }
  a { color: #79c0ff; } small, .dim { color: var(--dim); }
  pre.doc { white-space: pre-wrap; word-break: break-word; background: #0d1526;
        border: 1px solid var(--line); padding: .8rem; border-radius: 8px;
        font-size: 13px; max-height: 60vh; overflow-y: auto; }
  .toolbar { display: flex; gap: .5rem; margin-bottom: .8rem; flex-wrap: wrap;
        align-items: center; }
  select, button.act { background: var(--panel); color: var(--txt);
        border: 1px solid var(--line); border-radius: 6px; padding: .4rem .7rem;
        font-size: 13px; cursor: pointer; }
  button.act:hover { border-color: var(--acc); }
  h2 { margin: .2rem 0 .8rem; font-size: 18px; } h3 { color: var(--dim); font-size: 13px;
        text-transform: uppercase; margin: 1.2rem 0 .4rem; }
  .note { border-left: 3px solid var(--warn); padding: .4rem .7rem; color: var(--dim);
        margin-bottom: 1rem; font-size: 13px; }
</style>
</head>
<body>
<div id="topbar">
  <strong>SENTRA <span>Console</span></strong>
  <span id="relay" class="dim">relay: …</span>
  <span class="sp"></span>
  <small id="clock"></small>
</div>
<div id="layout">
  <nav>
    <button data-v="overview" class="on">Visão geral</button>
    <button data-v="runs">Runs</button>
    <button data-v="chats">Conversas</button>
    <button data-v="failures">Falhas <span class="cnt" id="failcnt" hidden></span></button>
    <button data-v="docs">Resumos</button>
    <button data-v="program">Programa</button>
    <footer>somente leitura<br>sem envios aos chats</footer>
  </nav>
  <main id="main"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
