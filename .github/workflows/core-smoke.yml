name: Core pipx smoke

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install core in an isolated pipx home
        run: |
          python -m pip install pipx
          python -m pipx install .
          python -m pipx inject sentra-core keyrings.alt
        env:
          PIPX_HOME: ${{ runner.temp }}/sentra-pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/sentra-bin
      - name: Test direct and local model routes against a local fixture
        run: |
          executable="$PIPX_BIN_DIR/sentra"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          "$executable" --help
          python tests/qa/core_pipx_smoke.py "$executable"
          python tests/qa/core_pipx_smoke.py "$executable" --local
        env:
          PIPX_BIN_DIR: ${{ runner.temp }}/sentra-bin
          # Ephemeral CI fixture only, never a recommendation for user secrets.
          PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
