name: SENTRA Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Build and signing stages cannot mutate the repository or publish releases.
permissions:
  contents: read

concurrency:
  group: sentra-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Require independently coordinated source freeze before any build
        shell: pwsh
        env:
          SENTRA_RELEASE_FREEZE_SHA: ${{ vars.SENTRA_RELEASE_FREEZE_SHA }}
        run: |
          if ($env:SENTRA_RELEASE_FREEZE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "No independently approved SENTRA_RELEASE_FREEZE_SHA; no build or install permitted"
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:SENTRA_RELEASE_FREEZE_SHA) {
            throw "Release source differs from approved freeze; refuse build"
          }

      - name: Install checksum-pinned actionlint for release
        shell: pwsh
        run: ./scripts/ci/install_actionlint.ps1 -WriteGitHubEnv

      - name: Validate release workflow semantics
        shell: pwsh
        run: |
          & $env:SENTRA_ACTIONLINT .github/workflows/ci.yml .github/workflows/release-commander.yml .github/workflows/release-mcp-registry.yml
          if ($LASTEXITCODE -ne 0) { throw "Release workflow actionlint failed" }

      - name: Verify tracked release inputs
        shell: pwsh
        run: |
          $required = @(
            "requirements.lock.txt",
            "native_bridge/bootstrap.py",
            "sentra_remote/tunnel_singleton.py",
            "sentra_mcp/services/authorization.py",
            "sentra_mcp/services/execution_workspace.py",
            "sentra_mcp/services/governance.py",
            "sentra_mcp/services/plugin_host.py",
            "sentra_mcp/services/control_store.py",
            "sentra_mcp/services/event_ingress.py",
            "sentra_mcp/services/routine_scheduler.py",
            "sentra_mcp/services/session_checkpoint.py",
            "sentra_mcp/services/task_ledger.py",
            "sentra_mcp/tools/governance.py",
            "sentra_core/conversation.py",
            "orchestrator/durable_resources.py",
            "orchestrator/integration.py",
            "orchestrator/process_lock.py",
            "orchestrator/rate_governor.py",
            "orchestrator/remote_candidate.py",
            "orchestrator/remote_runtime.py",
            "orchestrator/swarm_cycle.py",
            "orchestrator/turn_scheduler.py",
            "edge_extension/recovery-guard.js"
          )
          foreach ($path in $required) {
            git ls-files --error-unmatch -- $path *> $null
            if ($LASTEXITCODE -ne 0) { throw "Required release input is not tracked: $path" }
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Install SHA-256-pinned PDFium for Canvas packaging
        shell: pwsh
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r scripts/commander/requirements-pdfium-win-amd64.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned PDFium wheel install failed" }
          python -B -c "from scripts.commander.pdfium_pin import require_pdfium; require_pdfium()"
          if ($LASTEXITCODE -ne 0) { throw "PDFium 4.30.0 build pin failed" }

      - name: Install pinned Electron display runtime
        shell: pwsh
        run: |
          npm ci --prefix sentra_electron --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Pinned Electron display install failed" }
          npm test --prefix sentra_electron
          if ($LASTEXITCODE -ne 0) { throw "Electron display sandbox tests failed" }

      - name: Setup Node 24 for packaged local runtimes
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Build pinned Canvas and independent local runtimes
        shell: pwsh
        run: |
          foreach ($project in @("sentra_canvas/desktop_ui", "integrations/orca-terminal", "integrations/orca-mobile/transport")) {
            npm ci --prefix $project --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed: $project" }
          }
          npm run build --prefix sentra_canvas/desktop_ui
          if ($LASTEXITCODE -ne 0) { throw "Sealed Canvas build failed" }
          npm run build --prefix integrations/orca-terminal
          if ($LASTEXITCODE -ne 0) { throw "Terminal mirror build failed" }
          npm test --prefix integrations/orca-terminal
          if ($LASTEXITCODE -ne 0) { throw "Terminal mirror tests failed" }
          npm run typecheck --prefix integrations/orca-mobile/transport
          if ($LASTEXITCODE -ne 0) { throw "Mobile gateway typecheck failed" }
          npm test --prefix integrations/orca-mobile/transport
          if ($LASTEXITCODE -ne 0) { throw "Mobile transport tests failed" }

      - name: Fail closed on missing or uncommitted inputs
        shell: pwsh
        run: python -B scripts/ci/verify_release_contract.py --require-tracked

      - name: Bootstrap pinned Web Models test fixture
        shell: pwsh
        run: |
          ./scripts/integrations/Bootstrap-CodexChatGPTWeb.ps1
          if ($LASTEXITCODE -ne 0) { throw "Upstream bootstrap failed" }
          python -B scripts/ci/verify_release_contract.py --verify-upstream
          if ($LASTEXITCODE -ne 0) { throw "Upstream provenance verification failed" }

      - name: Resolve Desktop version
        shell: pwsh
        run: |
          $version = (python -c "from sentra_version import PRODUCT_VERSION; print(PRODUCT_VERSION)").Trim()
          if (-not $version) { throw "PRODUCT_VERSION is empty" }
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $expected = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Release tag $env:GITHUB_REF_NAME must equal $expected"
            }
          }
          "SENTRA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch and type-debt gates
        shell: pwsh
        run: |
          # The vendored upstream patch preserves source whitespace by design.
          # Its apply/hash/release contracts are tested separately.
          git diff --check -- . ':(exclude)integrations/codex_chatgpt_web/sentra-upstream.patch'
          python scripts/check_mypy_baseline.py

      - name: Canvas JavaScript and Edge regression
        shell: pwsh
        run: ./scripts/ci/test_canvas.ps1 -RequireEdge

      - name: Full regression
        shell: pwsh
        run: python -B -m pytest tests -q

      - name: Build signed-payload candidates
        shell: pwsh
        run: python scripts/commander/build_windows.py --dist dist --work build/commander --spec build/commander-spec --clean-output --phase payload

      - name: Install integrity-pinned Bun 1.4.0
        shell: pwsh
        run: ./scripts/ci/install_bun.ps1 -WriteGitHubEnv

      - name: Build pinned Web Models Electron payload
        shell: pwsh
        run: ./scripts/integrations/Build-CodexChatGPTWebRuntime.ps1 -Bun "$env:SENTRA_BUN" -Dist dist

      - name: Require Authenticode certificate for stable tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_B64) { throw "Stable release requires WINDOWS_CERTIFICATE_B64" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Stable release requires WINDOWS_CERTIFICATE_PASSWORD" }

      - name: Prepare signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_B64) {
            Write-Host "Unsigned workflow_dispatch build; it cannot become a stable release."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "sentra-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_B64))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $pfxData = Get-PfxData -FilePath $pfx -Password $secure
          $cert = $pfxData.EndEntityCertificates | Select-Object -First 1
          if (-not $cert) { throw "No end-entity certificate in PFX" }
          "SENTRA_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SENTRA_SIGNER_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign payload executables
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:SENTRA_PFX) { exit 0 }
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          foreach ($exe in Get-ChildItem dist\*.exe) {
            & signtool sign /f $env:SENTRA_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($exe.Name)" }
          }
          $webExe = "dist\web-models\win-unpacked\Codex Web GPT.exe"
          & signtool sign /f $env:SENTRA_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 $webExe
          if ($LASTEXITCODE -ne 0) { throw "Signing failed for Web Models Electron" }
          $displayExe = "sentra_electron\\node_modules\\electron\\dist\\electron.exe"
          if (-not (Test-Path $displayExe)) { throw "SENTRA Electron display runtime missing" }
          & signtool sign /f $env:SENTRA_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 $displayExe
          if ($LASTEXITCODE -ne 0) { throw "Signing failed for SENTRA Electron display" }

      - name: Seal signed payload build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          python -B scripts/commander/seal_payload.py --dist dist --trusted-signer "$env:SENTRA_SIGNER_THUMBPRINT"
          if ($LASTEXITCODE -ne 0) { throw "Signed payload seal failed" }

      - name: Build Setup with signed payload
        shell: pwsh
        run: python scripts/commander/build_windows.py --dist dist --work build/commander --spec build/commander-spec --phase installer
      - name: Sign Setup
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:SENTRA_PFX) { exit 0 }
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & signtool sign /f $env:SENTRA_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 dist\SENTRA-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Setup signing failed" }

      - name: Download pinned OpenAI tunnel-client
        shell: pwsh
        run: |
          $url = "https://github.com/openai/tunnel-client/releases/download/v0.0.14/tunnel-client-v0.0.14-windows-amd64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "tunnel-client-v0.0.14-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "784ab8da7b5a88f0109f1fd8aaf0a1c86067430b896dddf307ef7e3cc49fa1a5"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "OpenAI tunnel-client SHA-256 mismatch" }
          "SENTRA_TUNNEL_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create EXE, MSI, update package and SBOM
        shell: pwsh
        run: |
          python scripts/commander/release_assets.py --dist dist --release release --tunnel-archive $env:SENTRA_TUNNEL_ARCHIVE
      - name: Sign external cabinets, inscribe their trust and sign MSI
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          SENTRA_MSI_INSIGNIA: ${{ vars.SENTRA_MSI_INSIGNIA }}
        run: |
          if (-not $env:SENTRA_PFX) { exit 0 }
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $msi = Get-ChildItem release\SENTRA-Desktop-*-x64.msi | Select-Object -First 1
          $cabinets = @(Get-ChildItem release\SENTRA-Desktop-*-x64-*.cab)
          if ($cabinets.Count -eq 0) { throw "External MSI cabinets missing" }
          foreach ($cabinet in $cabinets) {
            & signtool sign /f $env:SENTRA_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 $cabinet.FullName
            if ($LASTEXITCODE -ne 0) { throw "External cabinet signing failed" }
          }
          $insignia = $env:SENTRA_MSI_INSIGNIA
          if (-not $insignia) {
            $command = Get-Command insignia.exe -ErrorAction SilentlyContinue
            if ($command) { $insignia = $command.Source }
            elseif ($env:WIX) { $insignia = Join-Path $env:WIX 'bin\insignia.exe' }
          }
          if (-not $insignia -or -not (Test-Path -LiteralPath $insignia -PathType Leaf)) {
            throw "Approved WiX Insignia is required to bind external CAB signatures; configure SENTRA_MSI_INSIGNIA"
          }
          & $insignia -im $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "External cabinet trust inscription failed" }
          & signtool sign /f $env:SENTRA_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestamp /td SHA256 $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSI signing failed" }
          python -B scripts/commander/release_signing.py --release release --trusted-signer "$env:SENTRA_SIGNER_THUMBPRINT" --refresh-msi-media
          if ($LASTEXITCODE -ne 0) { throw "Signed MSI media inventory refresh failed" }

      - name: Finalize hashes and signed update manifest
        shell: pwsh
        run: |
          python scripts/commander/release_assets.py --release release --finalize-only --signer-thumbprint "$env:SENTRA_SIGNER_THUMBPRINT"

      - name: Audit immutable release, SBOM, update ZIP and payload provenance
        shell: pwsh
        run: |
          python -B scripts/commander/release_doctor.py --release release --dist dist --trusted-signer "$env:SENTRA_SIGNER_THUMBPRINT"
          if ($LASTEXITCODE -ne 0) { throw "Release Doctor rejected artifacts" }

      - name: Verify stable Authenticode signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $targets = @(
            (Get-ChildItem dist\*.exe),
            (Get-Item "dist\web-models\win-unpacked\Codex Web GPT.exe"),
            (Get-ChildItem release\SENTRA-Setup-*.exe),
            (Get-ChildItem release\SENTRA-Desktop-*-x64.msi),
            (Get-ChildItem release\SENTRA-Desktop-*-x64-*.cab)
          )
          foreach ($file in $targets) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { throw "Invalid signature: $($file.Name)" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:SENTRA_SIGNER_THUMBPRINT) {
              throw "Unexpected signer: $($file.Name)"
            }
          }
      - name: Packaged executable smoke
        shell: pwsh
        run: |
          $executables = @(
            "sentra-agent.exe",
            "sentra-mcp.exe",
            "sentra-browser-relay.exe",
            "sentra-diagnostics.exe",
            "sentra-admin.exe",
            "sentra-update-helper.exe",
            "sentra-oma.exe",
            "sentra-desktop.exe",
            "sentra-human.exe",
            "sentra-human-worker.exe",
            "sentra-cli.exe",
            "sentra-canvas.exe",
            "sentra.exe",
            "SENTRA-Setup.exe"
          )
          foreach ($name in $executables) {
            $process = Start-Process -FilePath (Join-Path "dist" $name) -ArgumentList "--help" -PassThru -Wait -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "$name smoke failed with $($process.ExitCode)" }
          }

      - name: Real Setup install/uninstall roundtrip
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sentra-install-smoke"
          $install = Join-Path $root "Commander"
          $state = Join-Path $root "state"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          $arguments = @(
            "--silent", "--install-dir", $install,
            "--state-dir", $state,
            "--tunnel-archive", $env:SENTRA_TUNNEL_ARCHIVE,
            "--no-git", "--no-launch", "--no-system-registration",
            "--mcp-port", "18000", "--relay-port", "18765",
            "--stop-after-doctor"
          )
          $setup = Start-Process -FilePath ".\dist\SENTRA-Setup.exe" -ArgumentList $arguments -PassThru -Wait -NoNewWindow
          if ($setup.ExitCode -ne 0) { throw "real setup installation failed with $($setup.ExitCode)" }
          if (-not (Test-Path "$install\sentra-desktop.exe")) { throw "control center not installed" }
          if (-not (Test-Path "$install\sentra-human.exe")) { throw "human UI not installed" }
          if (-not (Test-Path "$install\sentra-human-worker.exe")) { throw "human worker not installed" }
          if (-not (Test-Path "$install\sentra.exe")) { throw "durable run CLI not installed" }
          if (-not (Test-Path "$install\sentra-cli.exe")) { throw "interactive SENTRA CLI not installed" }
          if (-not (Test-Path "$install\sentra-canvas.exe")) { throw "native SENTRA Canvas not installed" }
          if (-not (Test-Path "$install\docs\START_HERE.md")) { throw "START HERE onboarding guide not installed" }
          if (-not (Test-Path "$install\docs\SENTRA_PRIMEIRA_INSTALACAO_CANVAS_PLUGIN_2026-10-09.md")) {
            throw "Canvas and ChatGPT plugin first-install guide not installed"
          }
          if (-not (Test-Path "$install\docs\onboarding_media\SENTRA_SETUP_GUIDE.html")) { throw "visual setup guide not installed" }
          if (-not (Test-Path "$install\docs\onboarding_media\mcp-create-tunnel.mp4")) { throw "tunnel tutorial not installed" }
          if (-not (Test-Path "$install\docs\onboarding_media\mcp-connect-connector.mp4")) { throw "connector tutorial not installed" }
          if (-not (Test-Path "$install\sentra-installer.exe")) { throw "EXE uninstall helper not installed" }
          if (-not (Test-Path "$install\tunnel-client.exe")) { throw "tunnel-client not installed" }
          if (-not (Test-Path "$install\edge_extension\manifest.json")) { throw "Edge extension not installed" }
          if (-not (Test-Path "$install\web-models\win-unpacked\Codex Web GPT.exe")) { throw "Web Models Electron not installed" }
          if (-not (Test-Path "$install\web-models\win-unpacked\resources\runtime\manifest.json")) { throw "Web Models runtime not installed" }
          if (-not (Test-Path "$install\web-models\licenses\codex-chatgpt-web\LICENSE")) { throw "Web Models license notice not installed" }
          if (-not (Test-Path "$install\web-models\integration-build.json")) { throw "Web Models integration metadata not installed" }
          if (-not (Test-Path "$install\sentra-electron\electron.exe")) { throw "SENTRA Electron runtime not installed" }
          if (-not (Test-Path "$install\sentra-electron\sentra-surface-build.json")) { throw "SENTRA Electron provenance not installed" }
          if (Get-NetTCPConnection -LocalPort 18000,18765 -State Listen -ErrorAction SilentlyContinue) {
            throw "stop-after-doctor left test services running"
          }
          $uninstallArgs = @(
            "--uninstall", "--install-dir", $install,
            "--state-dir", $state, "--no-system-registration"
          )
          $uninstall = Start-Process -FilePath "$install\sentra-installer.exe" -ArgumentList $uninstallArgs -PassThru -Wait -NoNewWindow
          if ($uninstall.ExitCode -ne 0) { throw "uninstall failed with $($uninstall.ExitCode)" }
          # Uninstall returns after handing cleanup to the external helper.
          # Wait for actual deletion; a 5-second polling loop was racy on slow CI disks.
          for ($i = 0; $i -lt 120 -and (Test-Path $install); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $install) { throw "install directory remained after uninstall" }
          if (Test-Path $state) { throw "state directory remained after uninstall" }
      - name: Verify release checksums
        shell: pwsh
        run: |
          foreach ($line in Get-Content release\SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $expected = $Matches[1]
            $file = Join-Path "release" $Matches[2]
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "Checksum mismatch for $file" }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentra-desktop-windows-x64
          path: |
            release/SENTRA-Setup-*.exe
            release/SENTRA-Desktop-*-x64.msi
            release/SENTRA-Desktop-*-x64-*.cab
            release/SENTRA-Desktop-*-x64.media.json
            release/SENTRA-Desktop-*-update.zip
            release/SENTRA-Desktop-*.cdx.json
            release/SHA256SUMS.txt
            release/release-manifest.json
            release/package-components.json
            release/package-artwork.json

  publish-release:
    name: Publish verified immutable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read-only checkout for fail-closed publication gate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download only validated artifacts from this workflow run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name sentra-desktop-windows-x64 --dir release
          if ($LASTEXITCODE -ne 0) { throw "Validated release artifact unavailable" }
      - name: Reverify downloaded release hashes
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/SHA256SUMS.txt')) { throw "Missing SHA256SUMS" }
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed checksum manifest" }
            $file = Join-Path release $Matches[2]
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing checksum target: $file" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) {
              throw "Release checksum mismatch: $file"
            }
          }
      - name: Import independently reviewed disposable-VM QA artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRA_QA_VM_RUN_ID: ${{ vars.SENTRA_QA_VM_RUN_ID }}
        run: |
          if ($env:SENTRA_QA_VM_RUN_ID -notmatch '^[1-9][0-9]{5,19}$') {
            throw "Separate approved VM QA workflow run id is missing"
          }
          if ($env:SENTRA_QA_VM_RUN_ID -eq "${{ github.run_id }}") {
            throw "VM QA cannot be this same release build run"
          }
          gh run download $env:SENTRA_QA_VM_RUN_ID --repo "${{ github.repository }}" --name sentra-vm-qa-evidence --dir release
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'release/qa-vm-evidence.json')) {
            throw "No independently reviewed disposable VM QA evidence available"
          }

      - name: Block publication without independent clean VM QA evidence
        shell: pwsh
        env:
          SENTRA_QA_VM_EVIDENCE_SHA256: ${{ secrets.SENTRA_QA_VM_EVIDENCE_SHA256 }}
        run: |
          # The separate disposable VM QA must upload release/qa-vm-evidence.json
          # from the SAME candidate. This workflow does not manufacture proof.
          python -B scripts/commander/release_publish_gate.py --release release --evidence release/qa-vm-evidence.json --expected-sha256 "$env:SENTRA_QA_VM_EVIDENCE_SHA256" --version "$($env:GITHUB_REF_NAME.TrimStart('v'))"
          if ($LASTEXITCODE -ne 0) { throw "Independent clean-install evidence missing; stable release blocked" }
      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; published versions are immutable" }
          # Exclude the independent VM QA attestation; it is internal evidence,
          # not a public release asset or a redistributable diagnostic.
          $assetNames = @('SHA256SUMS.txt', 'release-manifest.json')
          foreach ($line in Get-Content release/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$') { throw "Malformed public asset inventory" }
            $assetNames += $Matches[2]
          }
          if (@($assetNames | Select-Object -Unique).Count -ne $assetNames.Count) { throw "Duplicate public asset" }
          $assets = @($assetNames | ForEach-Object { (Get-Item -LiteralPath (Join-Path release $_)).FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --repo "${{ github.repository }}" --generate-notes --title "SENTRA Desktop $($env:GITHUB_REF_NAME.TrimStart('v'))"
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
