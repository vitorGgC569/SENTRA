name: SENTRA download page
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['SENTRA Android preview']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: sentra-pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/site -v
      - run: node --test tests/site/downloads.test.cjs
      - run: python scripts/site/build.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .tmp/pages
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
