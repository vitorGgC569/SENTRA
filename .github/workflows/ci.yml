name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sentra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  contract:
    name: Source and supply-chain contract
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Reject missing, untracked or unsafe release inputs
        run: python -B scripts/ci/verify_release_contract.py --require-tracked
      - name: Install checksum-verified actionlint
        run: ./scripts/ci/install_actionlint.ps1 -WriteGitHubEnv
      - name: Validate GitHub Actions jobs and expression semantics
        run: |
          & $env:SENTRA_ACTIONLINT .github/workflows/ci.yml .github/workflows/release-commander.yml .github/workflows/release-mcp-registry.yml
          if ($LASTEXITCODE -ne 0) { throw "GitHub Actions semantic validation failed" }
      - name: Check whitespace
        run: |
          git show --format= --check HEAD -- . ':(exclude)integrations/codex_chatgpt_web/sentra-upstream.patch'
          if ($LASTEXITCODE -ne 0) { throw "Whitespace contract failed" }

  python:
    name: Python - ${{ matrix.target }}
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: ["tests/unit", "tests/failure", "tests/integration"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hash-pinned Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Python dependency conflict" }
      - name: Restore pinned upstream test fixture
        run: |
          ./scripts/integrations/Bootstrap-CodexChatGPTWeb.ps1
          if ($LASTEXITCODE -ne 0) { throw "Upstream fixture bootstrap failed" }
          python -B scripts/ci/verify_release_contract.py --verify-upstream
          if ($LASTEXITCODE -ne 0) { throw "Pinned Web Models fixture invalid" }
      - name: Enforce type-debt baseline
        if: matrix.target == 'tests/unit'
        run: |
          python -B scripts/check_mypy_baseline.py
          if ($LASTEXITCODE -ne 0) { throw "Type-debt baseline regressed" }
      - name: Deterministic test suite
        run: |
          python -B -m pytest -q ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "Required pytest suite failed" }

  canvas:
    name: Canvas Windows/Edge E2E
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hash-pinned Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Locked Python dependencies unavailable" }
      - name: Check Canvas JavaScript and run real Edge E2E
        run: ./scripts/ci/test_canvas.ps1 -RequireEdge

  web-models:
    name: Pinned Web Models / Electron
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install SHA-256-pinned Bun
        run: ./scripts/ci/install_bun.ps1 -WriteGitHubEnv
      - name: Verify upstream patch, TypeScript, integrations and Electron renderer
        run: ./scripts/ci/test_web_models.ps1 -Bun "$env:SENTRA_BUN"

  ci-required:
    name: CI required
    if: always()
    needs: [contract, python, canvas, web-models]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Reject any skipped, failed or cancelled required job
        env:
          CONTRACT: ${{ needs.contract.result }}
          PYTHON: ${{ needs.python.result }}
          CANVAS: ${{ needs.canvas.result }}
          WEB_MODELS: ${{ needs.web-models.result }}
        run: |
          foreach ($name in @("CONTRACT", "PYTHON", "CANVAS", "WEB_MODELS")) {
            $status = [Environment]::GetEnvironmentVariable($name)
            if ($status -ne "success") { throw "CI gate $name was $status, expected success" }
          }
          Write-Host "SENTRA_CI_ALL_REQUIRED_GATES_PASSED"
