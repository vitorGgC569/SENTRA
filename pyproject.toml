[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-core"
version = "1.0.5.dev0"
description = "SENTRA command-line agent and coordination core"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "httpx>=0.27,<1", "pydantic>=2.5", "PyYAML>=6", "GitPython>=3.1.40",
  "rich>=15,<16", "keyring>=25", "typing-extensions>=4.9", "mcp>=2,<3",
  "openai>=1.10", "pypdf>=5", "zstandard>=0.23,<1"
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
documents = ["pyarrow>=18"]
test = ["pytest>=8"]

[project.scripts]
sentra = "sentra_cli.core_entry:main"

[tool.setuptools]
py-modules = ["sentra_version"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sentra_*", "browser*", "local_model*", "memory*", "native_bridge*", "orchestrator*", "repository*", "self_improvement*", "workspace*"]
exclude = ["tests*", "*.test*", "*.fixtures*", "*.node_modules*", "*.desktop_ui*", "*.static*", "*.evidence*", "*.assets*", "*.vendor*", "sentra_electron*"]
namespaces = true
