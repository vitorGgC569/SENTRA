<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENTRA Studio · Revisão responsiva</title><style>
*{box-sizing:border-box}body{margin:0;background:#101516;color:#e7eee9;font:13px 'Segoe UI',sans-serif}header{height:65px;display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid #34413c}header strong{font-weight:500;letter-spacing:.2px}header span{color:#b0c2b5;font-size:11px}label{display:flex;gap:9px;align-items:center;margin-left:auto}select,button{font:12px 'Segoe UI',sans-serif;background:#25342c;color:#e7eee9;border:1px solid #58705f;border-radius:6px;padding:8px}button{cursor:pointer}.stage{display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow:auto;height:calc(100dvh - 65px)}.frame-box{position:relative;box-shadow:0 12px 40px #0006;flex-shrink:0;border-radius:8px;overflow:hidden}iframe{border:0;transform-origin:top left;background:#181c1d;position:absolute;left:0;top:0}a{color:#c3ecd2;text-decoration:none;font-size:11px}
</style></head><body><header><strong>SENTRA / revisão visual</strong><span id="size-label">1280 × 720</span><a href="/" target="_blank" rel="noopener">Abrir aplicativo ↗</a><label>Tamanho<select id="size"><option value="1280,720">1280 × 720</option><option value="1440,900">1440 × 900</option><option value="1920,1080">1920 × 1080</option><option value="768,1024">768 × 1024</option><option value="390,844">390 × 844</option><option value="720,450">720 × 450 · equivalente a 200%</option></select></label><button id="reload">Reiniciar exemplo</button></header><div class="stage"><div class="frame-box"><iframe title="Protótipo SENTRA no tamanho escolhido" src="/"></iframe></div></div><script>
const frame=document.querySelector('iframe'),box=document.querySelector('.frame-box'),size=document.querySelector('#size');
function fit(){const [width,height]=size.value.split(',').map(Number),scale=Math.min(1,(innerWidth-44)/width,(innerHeight-109)/height);frame.width=width;frame.height=height;frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';box.style.width=width*scale+'px';box.style.height=height*scale+'px';document.querySelector('#size-label').textContent=width+' × '+height;}
size.addEventListener('change',fit);addEventListener('resize',fit);document.querySelector('#reload').addEventListener('click',()=>frame.contentWindow.location.reload());fit();
</script></body></html>
